<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glaze</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <p>Glaze</p>
        <div class="btn-container">
          <button class="btn" id="setting-btn">⚙</button>
          <button class="btn" id="about-btn">ℹ</button>
        </div>
      </div>

      <div class="main">
        <div class="input-container">
          <input id="task-input" type="text" />
          <button class="btn" id="add-btn">+</button>
        </div>
        <ul id="task-list"></ul>
      </div>

      <div class="footer">
        <p><span id="left-tasks">0</span> tasks left</p>
        <button class="btn" id="clear-btn">Clear done</button>
      </div>
    </div>
    <script src="js/scripts.js"></script>
  </body>
</html>
