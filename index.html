<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glaze</title>
    <link rel="stylesheet" href="styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <p>Glaze</p>
        <div class="btn-container">
          <button class="btn" id="settings-btn">⚙</button>
          <button class="btn" id="about-btn">ℹ</button>
        </div>
      </div>

      <div class="main">
        <div class="input-container">
          <input
            class="text-input"
            id="task-input"
            type="text"
            placeholder="Enter the task..."
          />
          <button class="btn" id="add-btn">+</button>
        </div>
        <ul id="task-list"></ul>
        <!-- место под settings -->
        <dialog id="settings-modal">
          <div class="container dialog-content">
            <div class="header">
              <p>Settings</p>
              <button class="btn" id="close-settings-btn">&times;</button>
            </div>
            <div class="input-container">
              <input
                placeholder="http//:"
                class="text-input"
                id="bg-input"
                type="text"
              />
              <button class="btn text-btn" id="apply-btn">Apply</button>
            </div>
          </div>
        </dialog>

        <dialog id="about-modal">
          <div class="container about-content">
            <img src="img/logo/glaze_logo_app.png" alt="glaze logo" />
            <p class="application-name">Glaze</p>
            <p class="version">v1.0.0</p>
            <p class="about-text">
              A minimal todo app with glassmorphism design. Built with vanilla
              JS.
            </p>
          </div>
        </dialog>
      </div>

      <div class="footer">
        <p><span id="left-tasks">0</span> tasks left</p>
        <button class="btn text-btn" id="clear-btn">Clear done</button>
      </div>
    </div>
    <script src="js/scripts.js"></script>
  </body>
</html>
